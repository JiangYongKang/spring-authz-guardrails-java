server.port=0

# 访问令牌有效期（秒），默认 5 分钟
security.token.ttl-seconds=300
# 续期凭据有效期（秒），默认 14 天
security.refresh-token.ttl-seconds=1209600

# 业务接口限流（/api/**，按已认证主体 / 来源地址）
ratelimit.window-millis=60000
ratelimit.max-requests=20
ratelimit.max-failures=5

# 认证入口限流（/auth/login 与 /auth/refresh，与业务限流相互独立）
ratelimit.auth.window-millis=60000
ratelimit.auth.max-requests=200
ratelimit.auth.max-failures=5

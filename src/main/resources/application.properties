server.port=0

# ===== 本地认证授权护栏配置 =====
# 访问令牌有效期（秒）
guardrail.token.ttl-seconds=60
# HMAC-SHA256 签名密钥（仅本地演示，生产环境必须通过环境变量覆盖）
guardrail.token.hmac-key=local-dev-only-hmac-key-please-change

# 已认证访问限流：每个主体在滑动窗口内允许的请求数与窗口长度（秒）
guardrail.rate-limit.access-limit=10
guardrail.rate-limit.window-seconds=60

# 登录失败限流：同一用户名在滑动窗口内允许的失败次数与窗口长度（秒）
guardrail.rate-limit.login-failure-limit=5
guardrail.rate-limit.login-window-seconds=300

logging.level.com.github.highcumontoa=INFO

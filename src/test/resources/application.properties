server.port=0
# 测试中使用小阈值与短窗口，便于验证限流与窗口恢复
guardrail.token.ttl-seconds=60
guardrail.token.hmac-key=unit-test-hmac-key
guardrail.rate-limit.access-limit=5
guardrail.rate-limit.window-seconds=2
guardrail.rate-limit.login-failure-limit=3
guardrail.rate-limit.login-window-seconds=2
logging.level.com.github.highcumontoa=DEBUG
